# PKGBUILD patch rules for AUR packages
# Format: package_name|||search_string|||replace_string
# - Lines starting with '#' are comments
# - Empty lines are ignored
# - Multiple rules for the same package are applied in order
# - The search string is treated as a literal string (not regex)

# mesa-git: upstream llvm bumped to 22, fix soname dependency
mesa-git|||libLLVM.so=21.1-64|||libLLVM.so=22.1-64
lib32-mesa-git|||libLLVM.so=21.1-64|||libLLVM.so=22.1-64

# mesa-git: bindgen inline wrappers break when _build is a sibling of mesa/
# https://github.com/mesonbuild/meson/issues/13227
# Keep patterns free of '[' and trailing '\' — sed treats those as syntax.
mesa-git|||meson setup mesa _build|||meson setup mesa mesa/_build
mesa-git|||meson configure --no-pager _build|||meson configure --no-pager mesa/_build
mesa-git|||-C _build|||-C mesa/_build
mesa-git||| -d _build ||| -d mesa/_build 
mesa-git|||rm -rf _build|||rm -rf mesa/_build

# lib32-mesa-git: same out-of-tree bindgen path, plus virtio now needs venus-protocol
lib32-mesa-git|||meson setup mesa _build|||meson setup mesa mesa/_build
lib32-mesa-git|||meson configure --no-pager _build|||meson configure --no-pager mesa/_build
lib32-mesa-git|||-C _build|||-C mesa/_build
lib32-mesa-git||| -d _build ||| -d mesa/_build 
lib32-mesa-git|||rm -rf _build|||rm -rf mesa/_build
lib32-mesa-git|||--wrap-mode=nofallback|||--wrap-mode=nofallback --force-fallback-for=venus-protocol

# mangohud-git: newer source needs wayland-protocols at configure time
mangohud-git|||'vulkan-headers'|||'vulkan-headers' 'wayland-protocols'
